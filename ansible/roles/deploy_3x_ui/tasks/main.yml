---
- name: Download 3x-ui installer
  ansible.builtin.get_url:
    url: "{{ deploy_3x_ui_install_script_url }}"
    dest: "{{ deploy_3x_ui_installer_path }}"
    mode: "0755"

- name: Run 3x-ui installer
  ansible.builtin.command:
    cmd: "{{ deploy_3x_ui_installer_path }}"
  environment:
    XUI_NONINTERACTIVE: "1"
  args:
    creates: "{{ deploy_3x_ui_install_creates }}"

- name: Ensure x-ui panel is running and enabled
  ansible.builtin.systemd_service:
    name: "{{ deploy_3x_ui_service_name }}"
    state: started
    enabled: true
