---
- name: Проверить, что sshd подключает sshd_config.d
  ansible.builtin.command: grep -Eq '^\s*Include\s+/etc/ssh/sshd_config\.d' /etc/ssh/sshd_config
  register: ssh_hardening_include_check
  changed_when: false
  failed_when: ssh_hardening_include_check.rc != 0

- name: Применить drop-in конфиг харденинга
  ansible.builtin.template:
    src: sshd-hardening.conf.j2
    dest: "{{ ssh_hardening_config_dropin }}"
    mode: "0600"
    owner: root
    group: root
    validate: "/usr/sbin/sshd -t -f %s"
  notify: Перезапустить sshd
