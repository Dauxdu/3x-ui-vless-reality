---
- name: Проверить, что задан ключ
  ansible.builtin.assert:
    that: user_setup_admin_ssh_key | length > 0
    msg: >-
      Задайте user_setup_admin_ssh_key в host_vars

- name: Установить sudo
  ansible.builtin.apt:
    name: sudo
    state: present
    update_cache: true

- name: Создать админ-пользователя с группой sudo
  ansible.builtin.user:
    name: "{{ user_setup_admin_user }}"
    shell: "{{ user_setup_admin_shell }}"
    groups: sudo
    append: true
    state: present

- name: "Sudo без пароля для {{ user_setup_admin_user }}"
  ansible.builtin.copy:
    content: "{{ user_setup_admin_user }} ALL=(ALL) NOPASSWD:ALL\n"
    dest: "/etc/sudoers.d/{{ user_setup_admin_user }}"
    mode: "0440"
    validate: "visudo -cf %s"
  when: user_setup_admin_sudo_nopasswd | bool

- name: Установить публичный SSH-ключ
  ansible.posix.authorized_key:
    user: "{{ user_setup_admin_user }}"
    key: "{{ user_setup_admin_ssh_key }}"
    state: present
