---
- name: Установить ufw
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: true

- name: "Политика по умолчанию: запрещать входящие"
  community.general.ufw:
    direction: incoming
    policy: deny

- name: "Политика по умолчанию: разрешать исходящие"
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: Разрешить порты
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
    comment: "{{ item.comment }}"
  loop: "{{ ufw_rules_allow }}"

- name: Включить ufw
  community.general.ufw:
    state: enabled
    logging: "{{ ufw_rules_logging }}"
