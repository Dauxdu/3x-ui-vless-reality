---
deploy_nginx_domain: CHANGE_ME
deploy_nginx_acme_email: CHANGE_ME
deploy_nginx_site_source: "{{ playbook_dir }}/../site"
deploy_nginx_webroot: /var/www/site
deploy_nginx_site_conf: /etc/nginx/conf.d/site.conf
deploy_nginx_service_name: nginx
deploy_nginx_cert_keep_if_exists: true
deploy_nginx_certbot_hooks:
  - name: reload-site-nginx.sh
    content: |
      #!/bin/sh
      nginx -t && systemctl reload nginx
  - name: restart-site-panel.sh
    content: |
      #!/bin/sh
      systemctl is-active --quiet x-ui && systemctl restart x-ui
      exit 0
