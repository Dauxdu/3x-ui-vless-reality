---
- name: Validate required variables
  ansible.builtin.validate_argument_spec:
    argument_spec:
      deploy_nginx_domain:
        type: str
        required: true
      deploy_nginx_acme_email:
        type: str
        required: true

- name: Disable TLS until certificate exists
  ansible.builtin.set_fact:
    deploy_nginx_tls_enabled: false
