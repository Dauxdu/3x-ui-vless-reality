---
- name: Провижининг iNode
  hosts: inode
  become: true
  roles:
    - user_setup
    - ufw_rules
    - ssh_hardening
    - deploy_3x_ui

- name: Провижининг oNode
  hosts: onode
  become: true
  roles:
    - user_setup
    - role: dauxdu.roles.set_packages
      vars:
        set_packages_apt:
          - curl
          - nginx
          - certbot
    - ufw_rules
    - ssh_hardening
    - deploy_nginx
    - deploy_3x_ui
