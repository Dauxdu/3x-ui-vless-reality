<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 — inchange</title>
    <meta name="robots" content="noindex, follow" />
    <link rel="canonical" href="/" />
    <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#0a0c12" />
    <link rel="stylesheet" href="assets/css/main.css" />
    <script src="assets/js/i18n.js" defer></script>
  </head>
  <body class="page-404">
    <header class="top">
      <a class="brand" href="index.html" aria-label="На главную">
        <img
          class="mark"
          src="assets/img/logo.svg"
          alt=""
          width="32"
          height="32"
        />
        <span class="brand-name" data-i18n="siteName">inchange</span>
      </a>
      <nav class="lang" aria-label="Language / Язык">
        <button
          type="button"
          class="lang-btn is-active"
          data-lang="ru"
          aria-pressed="true"
        >
          RU
        </button>
        <span class="lang-sep" aria-hidden="true">/</span>
        <button
          type="button"
          class="lang-btn"
          data-lang="en"
          aria-pressed="false"
        >
          EN
        </button>
      </nav>

    <main id="main" class="hero hero-404">
      <p class="code404" aria-hidden="true">404</p>
      <h1 data-i18n="t404">Страница не найдена</h1>
      <p class="sub" data-i18n="d404">
        Такой страницы нет. Возможно, она появится позже.
      </p>
    </main>

    <footer class="foot">
      <p>
        <span data-i18n="footerTag">Self-hosted AI-мессенджер</span
